<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QTX 光谱反射色彩计算与可视化</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #18212b;
      --muted: #56606b;
      --accent: #1e6fff;
      --border: #d9dee7;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    header p {
      margin-top: 0;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .file-input {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .file-input input {
      display: none;
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 14px;
      resize: vertical;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    canvas {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fcfdff;
    }

    .results .result-grid {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 24px;
      align-items: center;
    }

    .swatch {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .swatch-box {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #eee;
    }

    .swatch-meta p {
      margin: 4px 0;
      font-weight: 600;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .metrics h3 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .metrics p {
      margin: 0;
      font-weight: 600;
    }

    @media (max-width: 800px) {
      .results .result-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>QTX 光谱反射色彩计算与可视化</h1>
      <p>
        上传 QTX 光谱反射数据或直接粘贴文本，系统将按照 D65 光源与 CIE 1931 2° 标准观测者
        进行 XYZ / Lab / sRGB 计算，并可视化反射曲线。
      </p>
    </header>

    <section class="panel">
      <div class="controls">
        <label class="file-input">
          <input type="file" id="fileInput" accept=".qtx,.txt" />
          选择 QTX 文件
        </label>
        <button id="sampleButton" type="button">加载示例数据</button>
        <button id="computeButton" type="button" class="primary">计算色彩</button>
      </div>
      <div class="grid">
        <div>
          <h2>光谱反射数据</h2>
          <textarea id="dataInput" placeholder="示例格式：\n400 5.2\n405 6.0\n...\n每行: 波长 反射率(%)"></textarea>
          <p class="hint">支持以空格或制表符分隔的两列数据，反射率可以为 0-1 或 0-100。</p>
        </div>
        <div>
          <h2>反射率曲线</h2>
          <canvas id="spectrumCanvas" width="540" height="320"></canvas>
        </div>
      </div>
    </section>

    <section class="panel results">
      <h2>计算结果</h2>
      <div class="result-grid">
        <div class="swatch">
          <div id="colorSwatch" class="swatch-box"></div>
          <div class="swatch-meta">
            <p id="srgbText">sRGB: -</p>
            <p id="hexText">HEX: -</p>
          </div>
        </div>
        <div class="metrics">
          <div>
            <h3>XYZ</h3>
            <p id="xyzText">-</p>
          </div>
          <div>
            <h3>xyY</h3>
            <p id="xyyText">-</p>
          </div>
          <div>
            <h3>Lab</h3>
            <p id="labText">-</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const CMF_DATA = {

        380, 385, 390, 395, 400, 405, 410, 415, 420, 425,

        530, 535, 540, 545, 550, 555, 560, 565, 570, 575,
        580, 585, 590, 595, 600, 605, 610, 615, 620, 625,
        630, 635, 640, 645, 650, 655, 660, 665, 670, 675,
        680, 685, 690, 695, 700, 705, 710, 715, 720, 725,
        730, 735, 740, 745, 750, 755, 760, 765, 770, 775,
        780
      ],
      xbar: [
        0.001368, 0.002236, 0.004243, 0.007650, 0.014310,
        0.023190, 0.043510, 0.077630, 0.134380, 0.214770,

        0.318700, 0.290800, 0.251100, 0.195360, 0.142100,
        0.095640, 0.057950, 0.032010, 0.014700, 0.004900,
        0.002400, 0.009300, 0.029100, 0.063270, 0.109600,
        0.165500, 0.225750, 0.290400, 0.359700, 0.433450,
        0.512050, 0.594500, 0.678400, 0.762100, 0.842500,
        0.916300, 0.978600, 1.026300, 1.056700, 1.062200,
        1.045600, 1.002600, 0.938400, 0.854450, 0.751400,
        0.642400, 0.541900, 0.447900, 0.360800, 0.283500,
        0.218700, 0.164900, 0.121200, 0.087400, 0.063600,
        0.046770, 0.032900, 0.022700, 0.015840, 0.011359,
        0.008111, 0.005790, 0.004109, 0.002899, 0.002049,
        0.001440, 0.001000, 0.000690, 0.000476, 0.000332,
        0.000235, 0.000166, 0.000117, 0.000083, 0.000059,
        0.000042
      ],
      ybar: [
        0.000039, 0.000064, 0.000120, 0.000217, 0.000396,
        0.000640, 0.001210, 0.002180, 0.004000, 0.007300,
        0.011600, 0.016840, 0.023000, 0.029800, 0.038000,
        0.048000, 0.060000, 0.073900, 0.090980, 0.112600,
        0.139020, 0.169300, 0.208020, 0.258600, 0.323000,
        0.407300, 0.503000, 0.608200, 0.710000, 0.793200,
        0.862000, 0.914850, 0.954000, 0.980300, 0.994950,
        1.000000, 0.995000, 0.978600, 0.952000, 0.915400,
        0.870000, 0.816300, 0.757000, 0.694900, 0.631000,
        0.566800, 0.503000, 0.441200, 0.381000, 0.321000,
        0.265000, 0.217000, 0.175000, 0.138200, 0.107000,
        0.081600, 0.061000, 0.044580, 0.032000, 0.023200,

        0.000015
      ],
      zbar: [
        0.006450, 0.010550, 0.020050, 0.036210, 0.067850,
        0.110200, 0.207400, 0.371300, 0.645600, 1.039050,
        1.385600, 1.622960, 1.747060, 1.782600, 1.772110,
        1.744100, 1.669200, 1.528100, 1.287640, 1.041900,
        0.812950, 0.616200, 0.465180, 0.353300, 0.272000,
        0.212300, 0.158200, 0.111700, 0.078250, 0.057250,
        0.042160, 0.029840, 0.020300, 0.013400, 0.008750,
        0.005750, 0.003900, 0.002750, 0.002100, 0.001800,
        0.001650, 0.001400, 0.001100, 0.001000, 0.000800,
        0.000600, 0.000340, 0.000240, 0.000190, 0.000100,
        0.000050, 0.000030, 0.000020, 0.000010, 0.000000,
        0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
        0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
        0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
        0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
        0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
        0.000000
      ],
      d65: [
        49.9755, 52.3118, 54.6482, 68.7015, 82.7549,
        87.1204, 91.4860, 92.4589, 93.4318, 90.0570,
        86.6823, 95.7736, 104.8650, 110.9360, 117.0080,
        117.4100, 117.8120, 116.3360, 114.8610, 115.3920,
        115.9230, 112.3670, 108.8110, 109.0820, 109.3540,
        108.5780, 107.8020, 106.2960, 104.7900, 106.2390,
        107.6890, 106.0470, 104.4050, 104.2250, 104.0460,
        102.0230, 100.0000, 98.1671, 96.3342, 96.0611,
        95.7880, 92.2368, 88.6856, 89.3459, 90.0062,
        89.8026, 89.5991, 88.6489, 87.6987, 85.4936,
        83.2886, 83.4939, 83.6992, 81.8630, 80.0268,
        80.1207, 80.2146, 81.2462, 82.2778, 80.2810,
        78.2842, 74.0027, 69.7213, 70.6652, 71.6091,
        72.9790, 74.3490, 67.9765, 61.6040, 65.7448,
        69.8856, 72.4863, 75.0870, 69.3398, 63.5927,
        55.0054, 46.4182, 56.6118, 66.8054, 65.0941,
        63.3828
      ]
    };

    const SAMPLE_QTX = `400 5.2
410 6.7
420 8.5
430 10.3
440 12.4
450 15.8
460 21.0
470 28.1
480 35.6
490 42.9
500 49.2
510 55.1
520 60.4
530 64.9
540 69.1
550 72.6
560 74.8
570 75.9
580 76.4
590 76.2
600 75.4
610 74.2
620 72.8
630 70.5
640 67.4
650 63.8
660 59.6
670 54.8
680 49.3
690 43.2
700 37.0`;

    const dataInput = document.getElementById('dataInput');
    const fileInput = document.getElementById('fileInput');
    const sampleButton = document.getElementById('sampleButton');
    const computeButton = document.getElementById('computeButton');
    const spectrumCanvas = document.getElementById('spectrumCanvas');
    const ctx = spectrumCanvas.getContext('2d');

    const colorSwatch = document.getElementById('colorSwatch');
    const srgbText = document.getElementById('srgbText');
    const hexText = document.getElementById('hexText');
    const xyzText = document.getElementById('xyzText');
    const xyyText = document.getElementById('xyyText');
    const labText = document.getElementById('labText');

    const REF_WHITE = { x: 95.047, y: 100.0, z: 108.883 };

    function parseSpectralData(text) {
      const lines = text.split(/\r?\n/);
      const entries = [];
      for (const line of lines) {
        const cleaned = line.trim();
        if (!cleaned || cleaned.startsWith('#') || cleaned.startsWith('//')) {
          continue;
        }
        const numbers = cleaned.match(/-?\d*\.?\d+/g);
        if (!numbers || numbers.length < 2) {
          continue;
        }
        const wavelength = Number(numbers[0]);
        const reflectance = Number(numbers[1]);
        if (Number.isNaN(wavelength) || Number.isNaN(reflectance)) {
          continue;
        }
        entries.push({ wavelength, reflectance });
      }

      entries.sort((a, b) => a.wavelength - b.wavelength);
      return entries;
    }

    function interpolateReflectance(entries, wavelength) {
      if (!entries.length) {
        return 0;
      }
      if (wavelength <= entries[0].wavelength) {
        return entries[0].reflectance;
      }
      if (wavelength >= entries[entries.length - 1].wavelength) {
        return entries[entries.length - 1].reflectance;
      }
      for (let i = 0; i < entries.length - 1; i += 1) {
        const current = entries[i];
        const next = entries[i + 1];
        if (wavelength >= current.wavelength && wavelength <= next.wavelength) {
          const t = (wavelength - current.wavelength) / (next.wavelength - current.wavelength);
          return current.reflectance + t * (next.reflectance - current.reflectance);
        }
      }
      return 0;
    }

    function normalizeReflectance(value) {
      if (value > 1.0) {
        return value / 100;
      }
      return value;
    }

    function computeXYZ(entries) {
      const { wavelengths, xbar, ybar, zbar, d65 } = CMF_DATA;
      const step = 5;
      let sumX = 0;
      let sumY = 0;
      let sumZ = 0;
      let kDen = 0;

      wavelengths.forEach((wl, idx) => {
        const raw = interpolateReflectance(entries, wl);
        const r = normalizeReflectance(raw);
        const spd = d65[idx];
        kDen += spd * ybar[idx] * step;
        sumX += r * spd * xbar[idx] * step;
        sumY += r * spd * ybar[idx] * step;
        sumZ += r * spd * zbar[idx] * step;
      });

      const k = kDen === 0 ? 0 : 100 / kDen;
      return {
        x: sumX * k,
        y: sumY * k,
        z: sumZ * k
      };
    }

    function xyzToLinearRgb({ x, y, z }) {
      const xr = x / 100;
      const yr = y / 100;
      const zr = z / 100;
      return {
        r: 3.2406 * xr - 1.5372 * yr - 0.4986 * zr,
        g: -0.9689 * xr + 1.8758 * yr + 0.0415 * zr,
        b: 0.0557 * xr - 0.2040 * yr + 1.0570 * zr
      };
    }

    function linearToSrgb(channel) {
      if (channel <= 0.0031308) {
        return 12.92 * channel;
      }
      return 1.055 * Math.pow(channel, 1 / 2.4) - 0.055;
    }

    function clamp01(value) {
      return Math.min(1, Math.max(0, value));
    }

    function xyzToLab({ x, y, z }) {
      const fx = fLab(x / REF_WHITE.x);
      const fy = fLab(y / REF_WHITE.y);
      const fz = fLab(z / REF_WHITE.z);
      return {
        l: Math.max(0, 116 * fy - 16),
        a: 500 * (fx - fy),
        b: 200 * (fy - fz)
      };
    }

    function fLab(t) {
      const delta = 6 / 29;
      if (t > Math.pow(delta, 3)) {
        return Math.cbrt(t);
      }
      return t / (3 * delta * delta) + 4 / 29;
    }

    function xyzToXyy({ x, y, z }) {
      const sum = x + y + z;
      if (sum === 0) {
        return { x: 0, y: 0, Y: y };
      }
      return { x: x / sum, y: y / sum, Y: y };
    }

    function formatNumber(value, digits = 2) {
      return Number.isFinite(value) ? value.toFixed(digits) : '-';
    }

    function drawSpectrum(entries) {
      const width = spectrumCanvas.width;
      const height = spectrumCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#d0d7e2';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 5; i += 1) {
        const y = (height - 40) * (i / 5) + 20;
        ctx.moveTo(40, y);
        ctx.lineTo(width - 20, y);
      }
      ctx.stroke();

      ctx.strokeStyle = '#5c6f88';
      ctx.beginPath();
      ctx.moveTo(40, 20);
      ctx.lineTo(40, height - 20);
      ctx.lineTo(width - 20, height - 20);
      ctx.stroke();

      if (!entries.length) {
        return;
      }

      const minWl = 380;
      const maxWl = 780;

      ctx.strokeStyle = '#1e6fff';
      ctx.lineWidth = 2;
      ctx.beginPath();

      for (let wl = minWl; wl <= maxWl; wl += 5) {
        const value = interpolateReflectance(entries, wl);
        const r = normalizeReflectance(value);
        const x = 40 + ((wl - minWl) / (maxWl - minWl)) * (width - 60);
        const y = height - 20 - r * (height - 60);
        if (wl === minWl) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }

    function updateResults(entries) {
      const xyz = computeXYZ(entries);
      const lab = xyzToLab(xyz);
      const xyy = xyzToXyy(xyz);
      const linearRgb = xyzToLinearRgb(xyz);
      const srgb = {
        r: clamp01(linearToSrgb(linearRgb.r)),
        g: clamp01(linearToSrgb(linearRgb.g)),
        b: clamp01(linearToSrgb(linearRgb.b))
      };

      const rgb255 = {
        r: Math.round(srgb.r * 255),
        g: Math.round(srgb.g * 255),
        b: Math.round(srgb.b * 255)
      };

      const hex = `#${rgb255.r.toString(16).padStart(2, '0')}${rgb255.g
        .toString(16)
        .padStart(2, '0')}${rgb255.b.toString(16).padStart(2, '0')}`.toUpperCase();

      colorSwatch.style.background = hex;
      srgbText.textContent = `sRGB: ${rgb255.r}, ${rgb255.g}, ${rgb255.b}`;
      hexText.textContent = `HEX: ${hex}`;
      xyzText.textContent = `${formatNumber(xyz.x, 2)}, ${formatNumber(xyz.y, 2)}, ${formatNumber(xyz.z, 2)}`;
      xyyText.textContent = `${formatNumber(xyy.x, 4)}, ${formatNumber(xyy.y, 4)}, ${formatNumber(xyy.Y, 2)}`;
      labText.textContent = `${formatNumber(lab.l, 2)}, ${formatNumber(lab.a, 2)}, ${formatNumber(lab.b, 2)}`;
    }

    function handleCompute() {
      const entries = parseSpectralData(dataInput.value);
      if (!entries.length) {
        drawSpectrum([]);
        colorSwatch.style.background = '#eee';
        srgbText.textContent = 'sRGB: -';
        hexText.textContent = 'HEX: -';
        xyzText.textContent = '-';
        xyyText.textContent = '-';
        labText.textContent = '-';
        return;
      }
      drawSpectrum(entries);
      updateResults(entries);
    }

    fileInput.addEventListener('change', (event) => {
      const [file] = event.target.files;
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        dataInput.value = e.target.result;
        handleCompute();
      };
      reader.readAsText(file);
    });

    sampleButton.addEventListener('click', () => {
      dataInput.value = SAMPLE_QTX;
      handleCompute();
    });

    computeButton.addEventListener('click', () => {
      handleCompute();
    });

    drawSpectrum([]);
  </script>
</body>
</html>
